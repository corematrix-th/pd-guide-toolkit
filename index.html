<body>
<div class="app">
  <div class="topbar">
    <div>
      <div class="title">PD Guide Toolkit</div>
      <div class="byline">by Nasree Jehteh</div>
    </div>
    <div class="site-stats topbar-stats" aria-label="Website statistics">
      Visitors : <span id="visitorCount">-</span> | Views : <span id="viewCount">-</span> | Online : <span id="onlineCount">-</span>
    </div>
  </div>

  <div class="controlbar">
    <div class="field small">
      <label>Product</label>
      <select id="product">
        <option value="thinkpad">ThinkPad</option>
        <option value="ideapad">IdeaPad</option>
        <option value="desktop">Desktop</option>
        <option value="tiny">Tiny</option>
        <option value="aio">AIO</option>
      </select>
    </div>
    <div class="field">
      <label>Search</label>
      <input id="search" placeholder="no power, bsod, battery report, 2100">
    </div>
    <button class="clear" id="topClearBtn">Clear</button>
  </div>

  <div class="tree">
    <div class="col">
      <div class="col-title">LEVEL 1</div>
      <div id="level1"></div>
    </div>
    <div class="col wide">
      <div class="col-title">SYMPTOM / GUIDE</div>
      <div id="symptom"></div>
    </div>
  </div>

  <div class="main">
    <div class="left">
      <div id="currentSelection" class="current-selection"></div>
      <div id="mainTitle" class="section-title">TROUBLESHOOTING CHECKLIST</div>
      <div id="checklist"></div>
      <div id="manualBox" class="manual hidden"></div>
    </div>

    <div class="right">
      <div id="recTitle" class="section-title">CONCLUSION</div>
      <div id="recommendation" class="recommendation">-</div>
      <div id="suggestion" class="suggestion hidden"></div>
<div class="section-title">RESULT / EMAIL</div>
      <textarea id="note" placeholder="Result note, guide, or email will show here..."></textarea>

      <div class="buttons">
        <button id="generateBtn">Generate Note</button>
        <button class="green" id="emailThBtn">Email TH</button>
        <button class="green" id="emailEnBtn">Email EN</button>
        <button class="gray" id="clearBtn">Clear</button>
      </div>

      <div class="version">Version 5.2.3</div>
    </div>
  </div>
</div>


<div id="guideModal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <div id="modalTitle" class="modal-title">Guide</div>
      <button class="modal-close" id="modalCloseBtn">Close</button>
    </div>
    <pre id="modalBody" class="modal-body"></pre>
  </div>
</div>

<script src="app.js?v=523r2"></script>
<script>
  // Firebase Realtime Database counters for PD Guide Toolkit.
  // Global path remains siteStats/global so historical counters are preserved.
  window.PD_FIREBASE_CONFIG = {
    apiKey: "AIzaSyCEbXMckd0TA5p2r88sLgxH9hTpGUaGNpI",
    authDomain: "pd-guide-toolkit.firebaseapp.com",
    databaseURL: "https://pd-guide-toolkit-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "pd-guide-toolkit",
    storageBucket: "pd-guide-toolkit.firebasestorage.app",
    messagingSenderId: "348983029780",
    appId: "1:348983029780:web:a1f53a65c8268663323701"
  };
  window.PD_SITE_STATS_STATUS = {
    state: "idle",
    connected: false,
    errors: [],
    lastUpdated: null
  };
</script>
<script type="module">
  const visitorEl = document.getElementById("visitorCount");
  const viewEl = document.getElementById("viewCount");
  const onlineEl = document.getElementById("onlineCount");
  const statsStatus = window.PD_SITE_STATS_STATUS;

  function formatCount(value){
    const number = Number(value);
    return Number.isFinite(number) && number >= 0 ? number.toLocaleString() : "0";
  }

  function setStatsState(state, extra = {}){
    Object.assign(statsStatus, extra, {
      state: statsStatus.errors.length ? "degraded" : state,
      lastUpdated: new Date().toISOString()
    });
  }

  function reportStatsError(stage, error){
    const message = error && error.message ? error.message : String(error || "Unknown error");
    const entry = `${stage}: ${message}`;
    if(!statsStatus.errors.includes(entry)) statsStatus.errors.push(entry);
    setStatsState("degraded");
    if(typeof console !== "undefined" && console.warn){
      console.warn(`[PD Site Stats] ${entry}`);
    }
  }

  function safeStorageGet(key){
    try { return window.localStorage ? window.localStorage.getItem(key) : null; }
    catch(error){ reportStatsError("localStorage read", error); return null; }
  }

  function safeStorageSet(key, value){
    try {
      if(window.localStorage) window.localStorage.setItem(key, value);
      return true;
    } catch(error){
      reportStatsError("localStorage write", error);
      return false;
    }
  }

  function createVisitorUuid(){
    if(window.crypto && typeof window.crypto.randomUUID === "function") return window.crypto.randomUUID();
    return `visitor-${Date.now()}-${Math.random().toString(36).slice(2, 12)}`;
  }

  async function initSiteStats(){
    if(!window.PD_FIREBASE_CONFIG) throw new Error("Firebase configuration is missing");
    setStatsState("loading");

    const { initializeApp, getApps, getApp } = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js");
    const {
      getDatabase, ref, onValue, set, push, remove, onDisconnect,
      runTransaction, serverTimestamp
    } = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js");

    const app = getApps().length ? getApp() : initializeApp(window.PD_FIREBASE_CONFIG);
    const db = getDatabase(app);
    const basePath = "siteStats/global";
    const visitorsRef = ref(db, `${basePath}/visitors`);
    const viewsRef = ref(db, `${basePath}/views`);
    const onlineUsersRef = ref(db, `${basePath}/onlineUsers`);
    const connectedRef = ref(db, ".info/connected");

    // Read counters independently so one failed operation does not blank all three values.
    onValue(visitorsRef, snapshot => {
      if(visitorEl) visitorEl.textContent = formatCount(snapshot.val());
    }, error => reportStatsError("Visitors read", error));

    onValue(viewsRef, snapshot => {
      if(viewEl) viewEl.textContent = formatCount(snapshot.val());
    }, error => reportStatsError("Views read", error));

    onValue(onlineUsersRef, snapshot => {
      const count = snapshot.exists() ? snapshot.size : 0;
      if(onlineEl) onlineEl.textContent = formatCount(count);
    }, error => reportStatsError("Online read", error));

    // Views increase on each page load. A failed write is reported but does not stop reads/presence.
    runTransaction(viewsRef, current => (Number(current) || 0) + 1)
      .catch(error => reportStatsError("Views increment", error));

    // Visitors are counted once per browser/profile. If a previous increment failed, the next load retries.
    const visitorUuidKey = "pdGuideToolkitVisitorUUID";
    const visitorCountedKey = "pdGuideToolkitVisitorCounted";
    let visitorUuid = safeStorageGet(visitorUuidKey);
    if(!visitorUuid){
      visitorUuid = createVisitorUuid();
      safeStorageSet(visitorUuidKey, visitorUuid);
    }
    if(!safeStorageGet(visitorCountedKey)){
      runTransaction(visitorsRef, current => (Number(current) || 0) + 1)
        .then(() => safeStorageSet(visitorCountedKey, "1"))
        .catch(error => reportStatsError("Visitors increment", error));
    }

    // Presence is grouped by the persistent browser/profile UUID. Each tab gets its own
    // child session, while the Online display counts only browser/profile parents.
    // Result: one browser with multiple tabs is Online = 1; another browser/device adds +1.
    const browserPresenceRef = ref(db, `${basePath}/onlineUsers/${visitorUuid}`);
    let presenceRef = null;
    onValue(connectedRef, async snapshot => {
      const connected = snapshot.val() === true;
      statsStatus.connected = connected;
      if(!connected){
        presenceRef = null;
        setStatsState("offline", {connected: false});
        return;
      }

      const nextPresenceRef = push(browserPresenceRef);
      try {
        await onDisconnect(nextPresenceRef).remove();
        await set(nextPresenceRef, { connectedAt: serverTimestamp() });
        presenceRef = nextPresenceRef;
        setStatsState("connected", {connected: true});
      } catch(error){
        reportStatsError("Online presence", error);
      }
    }, error => reportStatsError("Firebase connection", error));

    const cleanupPresence = () => {
      if(presenceRef) remove(presenceRef).catch(() => {});
    };
    window.addEventListener("pagehide", cleanupPresence);
    window.addEventListener("beforeunload", cleanupPresence);
  }

  function startSiteStats(attempt = 1){
    initSiteStats().catch(error => {
      reportStatsError(`Initialization attempt ${attempt}`, error);
      if(attempt < 3){
        window.setTimeout(() => startSiteStats(attempt + 1), attempt * 2500);
      }
    });
  }

  startSiteStats();
</script>
</body>
</html>
